# Manual: prepares (and optionally submits) an App Store version using the ASC API key secrets.
# Run with submit=false to create/update the version, attach the build and set What's New; review it in
# App Store Connect; then run again with submit=true to send it to App Review.
name: App Store release

on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version string, e.g. 1.0.1', required: true }
      build: { description: 'Build number to attach, e.g. 37', required: true }
      whats_new: { description: "What's New text (en-US)", required: true }
      submit: { description: 'Submit for review', type: boolean, default: false }

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare (and maybe submit) the version
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          APP: '6823700861'
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          WHATS_NEW: ${{ inputs.whats_new }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          pip install -q pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          E = os.environ; app = E["APP"]
          tok = jwt.encode({"iss": E["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
                           E["P8"], algorithm="ES256", headers={"kid": E["KEY_ID"], "typ": "JWT"})
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, data=data, method=method,
                    headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req) as r:
                          t = r.read(); return json.loads(t) if t else {}
                  except urllib.error.HTTPError as e:
                      raise SystemExit(f"{method} {path} -> {e.code}: {e.read().decode()[:1500]}")
                  except Exception as e:
                      if attempt == 3: raise
                      time.sleep(3)
          # 1. the version (create it if it doesn't exist yet)
          vs = call("GET", f"/v1/apps/{app}/appStoreVersions?filter[platform]=IOS&limit=20")["data"]
          v = next((x for x in vs if x["attributes"]["versionString"] == E["VERSION"]), None)
          if not v:
              v = call("POST", "/v1/appStoreVersions", {"data": {"type": "appStoreVersions",
                  "attributes": {"platform": "IOS", "versionString": E["VERSION"], "releaseType": "AFTER_APPROVAL"},
                  "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})["data"]
              print("Created version", E["VERSION"])
          vid = v["id"]; print("Version", E["VERSION"], "id", vid, "state", v["attributes"].get("appVersionState") or v["attributes"].get("appStoreState"))
          # 2. the build
          bs = call("GET", f"/v1/builds?filter[app]={app}&filter[version]={E['BUILD']}&filter[preReleaseVersion.version]={E['VERSION']}&limit=5")["data"]
          if not bs: raise SystemExit("Build not found: " + E["BUILD"])
          call("PATCH", f"/v1/appStoreVersions/{vid}/relationships/build", {"data": {"type": "builds", "id": bs[0]["id"]}})
          print("Attached build", E["BUILD"])
          # 3. What's New (every localization the version has; en-US gets the given text)
          locs = call("GET", f"/v1/appStoreVersions/{vid}/appStoreVersionLocalizations?limit=50")["data"]
          for l in locs:
              call("PATCH", f"/v1/appStoreVersionLocalizations/{l['id']}", {"data": {"type": "appStoreVersionLocalizations", "id": l["id"], "attributes": {"whatsNew": E["WHATS_NEW"]}}})
              a = l["attributes"]
              print(f"Localization {a.get('locale')}: whatsNew set; description {'present' if a.get('description') else 'MISSING'}, keywords {'present' if a.get('keywords') else 'MISSING'}")
          shots = 0
          for l in locs:
              sets = call("GET", f"/v1/appStoreVersionLocalizations/{l['id']}/appScreenshotSets?limit=20")["data"]
              shots += len(sets)
          print("Screenshot sets carried over:", shots)
          # 4. submit
          if E["SUBMIT"] == "true":
              sub = call("POST", "/v1/reviewSubmissions", {"data": {"type": "reviewSubmissions", "attributes": {"platform": "IOS"},
                  "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})["data"]
              call("POST", "/v1/reviewSubmissionItems", {"data": {"type": "reviewSubmissionItems",
                  "relationships": {"reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub["id"]}},
                                    "appStoreVersion": {"data": {"type": "appStoreVersions", "id": vid}}}}})
              call("PATCH", f"/v1/reviewSubmissions/{sub['id']}", {"data": {"type": "reviewSubmissions", "id": sub["id"], "attributes": {"submitted": True}}})
              print("SUBMITTED for review")
          else:
              print("Prepared, not submitted")
          PY
