<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat for Kindle</title>
<!-- E-ink edition: black and white, no animation, no fixed positioning, big tap targets. Same chats as the iPhone page. -->
<style>
html,body{margin:0;padding:0;background:#fff;color:#000}
body{font-family:Helvetica,Arial,sans-serif;font-size:24px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:rgba(0,0,0,0)}
#app{max-width:980px;margin:0 auto;padding:0 16px 24px;box-sizing:border-box}
a{color:#000;cursor:pointer}
a[data-act]{text-decoration:none}
.bar{display:table;width:100%;border-bottom:3px solid #000;padding:14px 0 12px;table-layout:fixed}
.bar>div{display:table-cell;vertical-align:middle}
.bl{width:22%;font-size:22px}.br{width:30%;text-align:right;font-size:22px}
.bl a,.br a{display:inline-block;padding:10px 4px;font-weight:bold}
.bt{text-align:center;font-size:28px;font-weight:bold;white-space:nowrap;overflow:hidden}
.ttl{display:inline-block}
.av{display:inline-block;width:62px;height:62px;line-height:62px;border-radius:50%;background:#000;color:#fff;text-align:center;font-size:24px;font-weight:bold;vertical-align:middle}
.av.sm{width:40px;height:40px;line-height:40px;font-size:17px;margin-right:10px}
.page{padding-top:12px}
.page p{line-height:1.4}
.empty{text-align:center;color:#444;margin:40px 0}
.row{display:block;padding:16px 0;border-bottom:2px solid #000}
.row .av{float:left;margin-right:16px}
.rt{display:block;overflow:hidden}
.rn{font-weight:bold;font-size:26px}
.rw{float:right;font-size:20px;color:#444}
.rp{display:block;color:#333;font-size:22px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{text-align:center;margin-top:22px}
.btn{font-family:inherit;font-size:24px;color:#000;background:#fff;border:3px solid #000;border-radius:14px;padding:16px 22px;margin:6px;-webkit-appearance:none}
.btn.primary{background:#000;color:#fff}
form .btn{display:block;width:100%;margin:16px 0 0}
label{display:block;font-weight:bold;margin:18px 0 8px}
.field{display:block;width:100%;box-sizing:border-box;font-size:26px;padding:14px;border:3px solid #000;border-radius:12px;-webkit-appearance:none}
.note{font-size:20px;color:#333}
.center{text-align:center}
.err{font-weight:bold;border:3px dashed #000;padding:12px;margin-top:16px}
.qr{text-align:center;margin:10px 0}
.qr svg{width:340px;height:340px}
.label{font-weight:bold;margin:18px 0 4px}
.mono{font-family:'Courier New',Courier,monospace;word-break:break-all;margin:0}
.mono.big{font-size:34px;font-weight:bold;letter-spacing:2px}
/* The thread */
.thread{padding:10px 0 6px}
.when{text-align:center;font-size:19px;color:#333;margin:22px 0 8px;font-weight:bold}
.who{font-size:18px;color:#333;margin:8px 0 2px 18px}
.msg{overflow:hidden;margin:3px 0}
.msg .b{display:inline-block;max-width:74%;padding:12px 18px;border-radius:26px;font-size:25px;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;box-sizing:border-box}
.msg.me .b{float:right;background:#000;color:#fff;border:3px solid #000}
.msg.me .b a{color:#fff}
.msg.them .b{float:left;background:#fff;border:3px solid #000}
.msg.me.tail .b{border-bottom-right-radius:6px}
.msg.them.tail .b{border-bottom-left-radius:6px}
.msg.failed .b{background:#fff;color:#000;border-style:dashed}
.rcpt{text-align:right;font-size:18px;color:#333;margin:2px 4px 6px}
.older{text-align:center;margin:6px 0 10px}
.older a{display:inline-block;border:2px solid #000;border-radius:20px;padding:8px 18px;font-size:20px}
.composer{position:relative;border-top:3px solid #000;padding-top:12px;margin-top:10px}
.msgin{display:block;width:100%;font-size:26px;padding:14px 150px 14px 18px;border:3px solid #000;border-radius:30px;box-sizing:border-box;-webkit-appearance:none}
.send{position:absolute;right:6px;top:18px;font-family:inherit;font-size:24px;font-weight:bold;background:#000;color:#fff;border:0;border-radius:24px;padding:12px 26px;-webkit-appearance:none}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center">Loading…</p></div>
<script>window.CHAT_MODE = 'kindle'; window.CHAT_PAGE_URL = location.href.split('#')[0].replace(/kindle\.html.*$/, '');</script>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="chat.js"></script>
</body>
</html>
