/* Layout: one phone-width column. A paper card holds the keyboard-shaped tracing frame; guess tiles sit beneath it;
   the typing keyboard at the bottom shares the frame's exact geometry so the eye can travel straight down from a corner
   of the squiggle to the key under it. */
:root{
  --bg:#F5F8FC; --bg2:#E9EFF8; --surface:#FFFFFF; --fg:#0F2749; --muted:#5F7390; --line:#D5E0EF;
  --cell:#EEF3FA; --cellline:#C8D8EC; --keycap:#FFFFFF; --keyboard:#E6EEF7; --keytext:#0F2749; --keyshadow:#B9C9DF;
  --ink:#295CBD; --ink2:#5B8DEF; --inksoft:rgba(41,92,189,.14); --guess:#FF6B5B; --gold:#F2B705; --goldsoft:rgba(242,183,5,.18); --goldink:#B8860B;
  --ok:#17A673; --near:#F08C00; --absent:#B5C3D8; --miss:#D9433F; --onstatus:#FFFFFF;
  --accent:#2F63C8; --onaccent:#FFFFFF; --scrim:rgba(15,39,73,.5);
  --logo:#061B40; --brush:#C8D8EC; --brushop:.6;
  --shadow:0 1px 0 rgba(15,39,73,.04), 0 12px 32px -16px rgba(15,39,73,.28);
  --hair:inset 0 0 0 1px var(--line); --lift:inset 0 0 0 1px var(--line), 0 1px 2px rgba(15,39,73,.05);
  --display:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1426; --bg2:#0F1A31; --surface:#141F3A; --fg:#EAF1FF; --muted:#91A4C6; --line:#243352;
    --cell:#1A2744; --cellline:#2A3B60; --keycap:#1E2A4A; --keyboard:#0B1426; --keytext:#EAF1FF; --keyshadow:#060D1C;
    --ink:#7C9DFF; --ink2:#A78BFA; --inksoft:rgba(124,157,255,.2); --guess:#FF6B5B; --gold:#FFC83D; --goldsoft:rgba(255,200,61,.2); --goldink:#FFC83D;
    --ok:#2ED39A; --near:#FFAE3D; --absent:#3A4A6E; --miss:#FF6B7F; --onstatus:#0B1426;
    --accent:#7C9DFF; --onaccent:#0B1426; --scrim:rgba(0,0,0,.62);
    --logo:#EAF1FF; --brush:#1C2A4B; --brushop:.9;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 14px 36px -16px rgba(0,0,0,.7);
    --hair:inset 0 0 0 1px var(--line); --lift:inset 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1426; --bg2:#0F1A31; --surface:#141F3A; --fg:#EAF1FF; --muted:#91A4C6; --line:#243352;
  --cell:#1A2744; --cellline:#2A3B60; --keycap:#1E2A4A; --keyboard:#0B1426; --keytext:#EAF1FF; --keyshadow:#060D1C;
  --ink:#7C9DFF; --ink2:#A78BFA; --inksoft:rgba(124,157,255,.2); --guess:#FF6B5B; --gold:#FFC83D; --goldsoft:rgba(255,200,61,.2); --goldink:#FFC83D;
  --ok:#2ED39A; --near:#FFAE3D; --absent:#3A4A6E; --miss:#FF6B7F; --onstatus:#0B1426;
  --accent:#7C9DFF; --onaccent:#0B1426; --scrim:rgba(0,0,0,.62);
  --logo:#EAF1FF; --brush:#1C2A4B; --brushop:.9;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 14px 36px -16px rgba(0,0,0,.7);
  --hair:inset 0 0 0 1px var(--line); --lift:inset 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* The document never scrolls (so iOS shows no page indicator); each view scrolls inside itself with hidden indicators. */
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.top,.rounds,.card,.status{flex-shrink:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding-left:max(16px,max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)));padding-right:max(16px,max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px)));
  padding-block:10px 12px;gap:10px}

/* Brush marks: two loose strokes behind the home screen, roughened by an SVG filter so they read as paint, not vector */
.brushbg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);z-index:0;pointer-events:none;display:none;color:var(--brush);opacity:var(--brushop)}
.app.onhome .brushbg{display:block}
.packbg{position:absolute;inset:0;z-index:0;pointer-events:none;display:none;background-size:cover;background-position:center top;background-repeat:no-repeat}
:root[data-pack].haspackbg .app.onhome .packbg{display:block} :root[data-pack].haspackbg .app.onhome .brushbg{display:none}
.top,.home,.game{position:relative;z-index:1}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* Header */
.top{display:flex;align-items:center;gap:10px}
.brandbtn{text-align:left;min-width:0;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden}
.app.onhome .brandbtn{visibility:hidden}
/* In play the header is a toolbar: mark + date only, so the ink pill and icons never crowd the wordmark */
.app:not(.onhome) .brand .wm{display:none}
.app:not(.onhome) .brandbtn{flex-direction:row;align-items:center;gap:8px}
.app:not(.onhome) .brand svg{width:42px;height:14px}
.app:not(.onhome) .sub{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.app:not(.onhome) #btnHow,.app:not(.onhome) #btnStats{display:none}
.game{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.game::-webkit-scrollbar,.home::-webkit-scrollbar{display:none}
/* Home: logo, date, a few buttons */
.home{display:flex;flex-direction:column;align-items:center;gap:16px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-block:4px 6px;position:relative;text-align:center}
@media (max-height:740px){.home{gap:12px} .home .logo{width:min(70vw,280px);margin-top:10px} .mbtn{min-height:58px} .mrow .mbtn{min-height:52px}}
.home .logo{width:min(82vw,330px);height:auto;overflow:visible;margin-top:min(5vh,34px);flex-shrink:0;color:var(--logo)}
.home .tag{font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:-4px;padding-left:.24em}
.home .daychip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--hair);font-size:13px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.home .daychip i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.home .daychip i.todo{background:var(--near)} .home .daychip i.fresh{background:var(--ink)}
.menu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin-top:6px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;background:var(--surface);box-shadow:var(--lift);text-align:left}
.mbtn .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 40px;background:var(--bg);color:var(--ink)}
.mbtn .mi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mbtn .mt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mbtn .mt b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.mbtn .mt small{color:var(--muted);font-size:13px}
.mbtn .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 18px}
.mbtn.primary{background:var(--accent);color:var(--onaccent);box-shadow:0 12px 26px -12px var(--accent)}
.mbtn.primary .mi{background:rgba(255,255,255,.18);color:#fff} .mbtn.primary .mt small{color:rgba(255,255,255,.8)} .mbtn.primary .chev{stroke:rgba(255,255,255,.8)}
.mbtn .mi.pink{background:rgba(255,107,91,.16);color:var(--guess)} .mbtn .mi.gold{background:var(--goldsoft);color:var(--goldink)} .mbtn .mi.mint{background:var(--inksoft);color:var(--ink)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow.three{grid-template-columns:1fr 1fr 1fr;gap:8px}
.mrow.three .mbtn{flex-direction:column;align-items:center;text-align:center;gap:7px;padding:12px 6px 10px;min-height:0}
.mrow.three .mbtn .mt{align-items:center;gap:1px} .mrow.three .mbtn .mt b{font-size:15px} .mrow.three .mbtn .mt small{font-size:11px;white-space:nowrap}
/* Packs sheet */
.packs{display:flex;flex-direction:column;gap:12px}
.pack{background:var(--bg);border-radius:16px;padding:12px}
.packhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.packhead .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.packhead b{font-family:var(--display);font-weight:600;font-size:17px} .packhead b em{font-style:normal;font-size:11px;font-weight:600;color:var(--guess);margin-left:6px;vertical-align:2px}
.packhead small{color:var(--muted);font-size:12px}
.swatch{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;flex:0 0 44px;box-shadow:var(--hair);background:var(--c);color:var(--a);--guess:var(--b)}
.swatch .ico{width:26px;height:26px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .swatch{background:var(--dc);color:var(--da);--guess:var(--db)}}
:root[data-theme="dark"] .swatch{background:var(--dc);color:var(--da);--guess:var(--db)}
.btns.small .btn{height:42px;font-size:15px;flex:1 1 100px}
.pack .switch{margin-top:8px;background:var(--surface)}
.inkpacks{display:flex;flex-direction:column;gap:8px}
.inkpacks .hintcard .price{background:var(--accent);color:var(--onaccent)}
.mrow .mbtn{min-height:58px;padding:10px 12px;gap:10px} .mrow .mbtn .mt b{font-size:16px}
.homefoot{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center;margin-top:auto;padding-top:6px;flex-shrink:0}
.homefoot .chip{height:28px;padding:0 10px;font-size:12px}
.menu,.hero,.daychip,.logo,.tag{flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--hair);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:14px;height:14px;fill:var(--gold)}
.chip.link{font-weight:500;color:var(--muted)}
.lcard,.lcard .mini{display:none}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:44px;height:15px;overflow:visible}
.sub{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:500}
.top .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--lift)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mbtn .mi .ico,.hintcard .ic .ico{width:24px;height:24px}
.ico .d{fill:var(--guess);stroke:none} .ico .r,.ico .c{stroke:var(--guess)} .ico .f{opacity:.32}
.mbtn.primary .ico .d,.btn.primary .ico .d{fill:#FF6B5B} .mbtn.primary .ico .r,.btn.primary .ico .r,.mbtn.primary .ico .c,.btn.primary .ico .c{stroke:#FF6B5B}
.mi.pink .ico .d{fill:var(--guess)}
.chip.streak svg{width:15px;height:15px;fill:none;stroke:var(--guess);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Round pills */
.rounds{display:flex;gap:8px;align-items:center}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:999px;
  background:var(--surface);color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;box-shadow:var(--hair)}
.pill.cur{background:var(--accent);color:var(--onaccent);box-shadow:none}
.pill.won{background:var(--ok);color:var(--onstatus);box-shadow:none}
.pill.lost{background:var(--absent);color:var(--onstatus);box-shadow:none}
.pill small{font-family:var(--body);font-weight:400;font-size:12px;opacity:.9}
.rounds .modetag{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surface);
  font-family:var(--display);font-weight:600;color:var(--fg);box-shadow:var(--hair);font-size:15px}

/* Glyph card */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
.glyph{display:block;width:100%;height:auto;aspect-ratio:1040/340;max-width:100%;overflow:visible}
.glyph .cellrect{fill:var(--cell);stroke:var(--cellline);stroke-width:2}
.glyph .ghost{fill:var(--muted);font-family:var(--display);font-weight:600;font-size:40px;text-anchor:middle;dominant-baseline:central;opacity:.55}
.glyph .ink{fill:none;stroke:var(--ink);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.glyph .inkhalo{fill:none;stroke:var(--inksoft);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.glyph .start{fill:var(--ink)}
.glyph .end{fill:none;stroke:var(--ink);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.glyph .loop{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round}
.glyph .mark{stroke:var(--surface);stroke-width:4}
.glyph .mark.ok{fill:var(--ok)} .glyph .mark.near{fill:var(--near)} .glyph .mark.no{fill:var(--absent)}
.glyph .pin circle,.glyph .pin rect{stroke:var(--surface);stroke-width:5}
.glyph .pin.ok circle,.glyph .pin.ok rect{fill:var(--ok)} .glyph .pin.near circle,.glyph .pin.near rect{fill:var(--near)}
.glyph .pin text{fill:var(--onstatus);font-family:var(--display);font-weight:700;font-size:38px;text-anchor:middle;dominant-baseline:central}
.glyph .cdot{stroke:var(--surface);stroke-width:5} .glyph .cdot.ok{fill:var(--ok)} .glyph .cdot.near{fill:var(--near)}
.glyph .cdot.anim{transform-box:fill-box;transform-origin:center;animation:pop .36s cubic-bezier(.2,1.4,.4,1) both}
.glyph .pin.anim{transform-box:fill-box;transform-origin:center;animation:pop .36s cubic-bezier(.2,1.4,.4,1) both}
.glyph .clean{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.glyph .lab circle{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.glyph .lab text{fill:var(--fg);font-family:var(--display);font-weight:700;font-size:44px;text-anchor:middle;dominant-baseline:central}
.glyph .lab.hit circle{fill:var(--ok);stroke:var(--ok)} .glyph .lab.hit text{fill:var(--onstatus)}
.glyph.draw{touch-action:none;cursor:crosshair}
.glyph .rival{fill:none;stroke:var(--near);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 14;opacity:.9}
.coach{background:var(--surface);border-left:4px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--fg);box-shadow:var(--hair);max-width:56ch;margin:0 auto 4px}
.coach b{color:var(--ink)}
.cardpreview{width:100%;max-width:260px;height:auto;border-radius:14px;box-shadow:var(--shadow);align-self:center;display:block}
/* Draw round reads top-down: prompt, canvas, result */
.app.drawmode .rounds{order:1} .app.drawmode .guesses{order:2;min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center} .app.drawmode .status{order:3;justify-content:center} .app.drawmode .status .msg{flex:0 1 auto;text-align:center} .app.drawmode .card{order:4;background:var(--keyboard);padding:8px 6px 10px} .app.drawmode .kb{order:5}
.app.drawmode .glyph{aspect-ratio:1040/430}
.app.drawmode .glyph .cellrect{fill:var(--keycap);stroke:none;filter:drop-shadow(0 3px 0 var(--keyshadow))}
.glyph .live,.glyph .stroke{fill:none;stroke:var(--guess);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.glyph .livestart{fill:var(--guess)}
@keyframes fadein{to{opacity:1}}
.pill svg{width:18px;height:18px}
.drawpanel{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:6px}
.drawpanel p{margin:0;color:var(--muted);font-size:14px;max-width:38ch}
.drawpanel .drift{font-variant-numeric:tabular-nums}
.drawpanel .eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.drawword{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.drawword .dl{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;background:var(--surface);box-shadow:var(--shadow);color:var(--fg)}
.drawword .dl.ok{background:var(--ok);color:var(--onstatus)} .drawword .dl.near{background:var(--near);color:var(--onstatus)} .drawword .dl.no{background:var(--absent);color:var(--onstatus)}
.sentence{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;max-width:36ch}
.sentence .sw{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3;color:var(--muted);padding:0 1px}
.sentence .sw.past{color:var(--fg);opacity:.5}
.sentence .sw.cur{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.sentence.done{gap:6px 8px}
.sentence.done .sw{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px 5px;border-radius:12px;background:var(--surface);box-shadow:var(--hair);color:var(--fg);font-size:16px;line-height:1.2}
.sentence.done .sw small{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sentence.done .sw.ok small{color:var(--ok)} .sentence.done .sw.near small{color:var(--near)}
.sentence.done .sw.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.glyph .live.fade,.glyph .livestart.fade{transition:opacity .3s ease;opacity:0}
.answer.long{font-size:22px;letter-spacing:0;text-transform:none;line-height:1.3}
.acc{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.acc b{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--ink)}
.acc span{color:var(--muted);font-size:14px}
.minilist.two{grid-template-columns:1fr 1fr} .minilist.two button{font-size:14px}
.minilist.three{grid-template-columns:1fr 1fr 1fr} .minilist.three button{font-size:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}

<script>
(function(){
'use strict';
/* Native iPhone app (Capacitor wrapper in ios-app/). The same page runs on the web and inside the app;
   these two flags are the only difference it ever checks. */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
const ANDROID=NATIVE&&window.Capacitor.getPlatform&&window.Capacitor.getPlatform()==='android';
const SHARE_URL=window.SQUIGGLE_SHARE_URL||(location.origin+location.pathname);
/* ---------- Sound: a tiny synth, no audio files. Unlocked by the first tap, muted from Settings. ---------- */
const SFX={on:store('sq.sound')!==false,ctx:null};
function audioCtx(){if(!SFX.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;SFX.ctx=new AC();}if(SFX.ctx.state==='suspended')SFX.ctx.resume().catch(()=>{});return SFX.ctx;}
function tone(f,dur,opts){opts=opts||{};const c=audioCtx();if(!c)return;const t=c.currentTime+(opts.at||0);const o=c.createOscillator(),g=c.createGain();o.type=opts.type||'sine';o.frequency.setValueAtTime(f,t);if(opts.to)o.frequency.exponentialRampToValueAtTime(opts.to,t+dur);
  const v=opts.vol||0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.02);}
function sfx(name){
  if(!SFX.on)return;
  try{switch(name){
    case 'tap':tone(1800,0.04,{type:'triangle',vol:0.06});break;
    case 'back':tone(900,0.05,{type:'triangle',vol:0.05});break;
    case 'open':tone(660,0.07,{type:'sine',vol:0.07,to:880});break;
    case 'bad':tone(220,0.14,{type:'triangle',vol:0.09,to:170});break;
    case 'reveal':tone(523,0.08,{type:'sine',vol:0.07});tone(659,0.08,{type:'sine',vol:0.07,at:0.07});break;
    case 'win':[523,659,784,1047].forEach((f,i)=>tone(f,0.16,{type:'sine',vol:0.1,at:i*0.08}));tone(1047,0.35,{type:'sine',vol:0.08,at:0.34,to:1319});break;
    case 'big':[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.18,{type:'sine',vol:0.1,at:i*0.07}));[784,1047,1319].forEach((f,i)=>tone(f,0.5,{type:'triangle',vol:0.05,at:0.45+i*0.02}));break;
    case 'lose':tone(392,0.18,{type:'sine',vol:0.08});tone(311,0.3,{type:'sine',vol:0.08,at:0.16});break;
    case 'ink':tone(1568,0.06,{type:'square',vol:0.04});tone(2093,0.12,{type:'square',vol:0.04,at:0.06});break;
    case 'spend':tone(1047,0.06,{type:'square',vol:0.04});tone(784,0.1,{type:'square',vol:0.04,at:0.06});break;
    case 'draw':tone(300,0.16,{type:'sine',vol:0.06,to:900});break;
    case 'lift':tone(900,0.12,{type:'sine',vol:0.06,to:400});break;
  }}catch(e){}
}
document.addEventListener('pointerdown',()=>{if(SFX.on)audioCtx();},{passive:true,once:false});
/* ---------- Confetti on a fixed canvas, palette colours, ~1.6 s ---------- */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=document.getElementById('fx');if(!cv){cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);}
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),cols=['--ink','--guess','--gold','--ok','--ink2'].map(v=>cs.getPropertyValue(v).trim()||'#3A2FD9');
  const P=[];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-0.5)*1.4,sp=380+Math.random()*420;P.push({x:innerWidth/2+(Math.random()-0.5)*120,y:innerHeight*0.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*14,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[i%cols.length],shape:Math.random()<0.3?'c':'r'});}
  let last=performance.now();const t0=last;
  function step(now){const dt=Math.min(0.033,(now-last)/1000);last=now;const age=(now-t0)/1000;x.clearRect(0,0,innerWidth,innerHeight);
    for(const q of P){q.vy+=1500*dt;q.vx*=0.985;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.globalAlpha=Math.max(0,1-Math.max(0,age-1.0)/0.6);x.fillStyle=q.c;if(q.shape==='c'){x.beginPath();x.arc(0,0,q.w/2,0,Math.PI*2);x.fill();}else x.fillRect(-q.w/2,-q.h/2,q.w,q.h*Math.abs(Math.cos(q.r*1.3)));x.restore();}
    if(age<1.7)requestAnimationFrame(step);else{x.clearRect(0,0,innerWidth,innerHeight);}}
  requestAnimationFrame(step);
}
function inkFloat(n){const pill=el('inkPill');if(!pill||!n)return;const R=pill.getBoundingClientRect();const d=document.createElement('div');d.className='inkfloat';d.textContent=`+${n}`;d.style.left=(R.left+R.width/2)+'px';d.style.top=(R.bottom+6)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
/* ---------- Theme: system, light or dark; the CSS already keys off data-theme on the root ---------- */
const THEME={mode:store('sq.theme')||'system'};
function applyTheme(){
  const root=document.documentElement;
  if(THEME.mode==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',THEME.mode);
  const dark=THEME.mode==='dark'||(THEME.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  if(NATIVE&&NP.StatusBar){try{NP.StatusBar.setStyle({style:dark?'DARK':'LIGHT'});}catch(e){}}
  /* Android draws edge to edge: the status bar and the gesture/navigation bar both sit over the page, so both need the right icon colour */
  if(ANDROID&&NP.SystemBars){try{NP.SystemBars.setStyle({style:dark?'DARK':'LIGHT'});}catch(e){}}
  const bg=(getComputedStyle(root).getPropertyValue('--bg')||'').trim()||(dark?'#0B1426':'#F5F8FC');
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.content=bg;});
}
function setTheme(mode){THEME.mode=mode;store('sq.theme',mode);applyTheme();}
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(THEME.mode==='system')applyTheme();});}catch(e){}
function haptic(kind){

  tut1:'Esta es la línea que dibujó un dedo al escribir deslizando una palabra de 3 letras. El punto es donde apoyó: en la <b>{a}</b>. Se deslizó a la <b>{b}</b> y luego a la <b>{c}</b>. Escribe <b>{w}</b> y pulsa Intro.',tut1b:'Verde es sobre la tecla, ámbar es la de al lado, gris es frío. Prueba <b>{w}</b>.',tut2:'Ahora en serio. La misma idea, pero solo ves la <b>forma</b>, no dónde estaba. Muévela por el teclado en tu cabeza: ¿qué tres teclas forman esta figura?',tut2b:'Cada esquina te dice a qué distancia cayó de la tecla real. Mira el teclado e inténtalo otra vez.',

  howTitle:'Cómo jugar',how1:'Cada garabato es la línea que dibuja un dedo al <b>escribir deslizando</b> una palabra en el teclado del móvil. El punto es donde apoya; la flecha, donde levanta.',how2:'Ves la forma a <b>tamaño real</b> pero no dónde estaba. Un barrido de cinco teclas en el teclado de abajo mide cinco teclas aquí. Muévela por el teclado en tu cabeza hasta que las esquinas caigan en letras que formen una palabra.',how3:'Escribe una palabra del largo correcto. Mientras escribes, tu propio trazo se dibuja sobre las teclas para comparar la forma antes de confirmar.',how4:'La pista es <b>distancia, no letras</b>. Cada esquina de tu intento dice a qué distancia cayó de la tecla real. Nada te dice si una letra está "en algún sitio de la palabra". Solo la forma. El teclado y el garabato muestran lo que sabes de <b>la casilla en la que estás</b>; toca cualquier casilla para verla.',how5:'<b>La cuarta ronda lo invierte.</b> Recibes la palabra y dibujas su garabato de memoria, de un trazo, sobre las teclas en blanco. Se puntúa lo cerca que pasa tu línea del trazo real.',howP1:'Tres garabatos para leer (4, 6 y 8 letras, <b>cuatro intentos</b> cada uno) y uno para dibujar. Resolver da <b>tinta</b>: más por palabras largas y pocos intentos, 1,5× en difícil, y un bono por terminar el día.',howP2:'La tinta compra pistas (primera letra, última letra, una del medio o <b>Colocar</b>, que pone el garabato sobre las teclas reales) y un intento más cuando se acaban. Las pistas se ven al compartir.',howP3:'<b>Modo difícil</b> (en Ajustes): tres intentos, sin marcas de inicio ni fin, y Colocar bloqueado.',startTracing:'Empezar',legendOn:'Sobre la tecla',legendNear:'Al lado (una tecla que la toca)',legendCold:'Frío',

  svg.innerHTML=s;
}

function penIcon(){return sq('draw','width:18px;height:18px');}
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist2(p[i],p[i-1]);return L;}
/* Uniform arc-length resample to exactly n points */
function resampleN(p,n){
  if(p.length===0) return [];
  if(p.length===1) return Array.from({length:n},()=>({x:p[0].x,y:p[0].y}));
  const L=pathLen(p);if(L===0) return Array.from({length:n},()=>({x:p[0].x,y:p[0].y}));
  const step=L/(n-1),out=[{x:p[0].x,y:p[0].y}];let acc=0,i=1,a=p[0];
  while(out.length<n-1&&i<p.length){
    const b=p[i],d=dist2(a,b);
    if(acc+d>=step){const t=(step-acc)/d;const q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};out.push(q);a=q;acc=0;}
    else{acc+=d;a=b;i++;}
  }
  while(out.length<n) out.push({x:p[p.length-1].x,y:p[p.length-1].y});
  return out;
}
/* The ideal trace is the polyline through key centers; keyAt[i] is the sample index where letter i sits */
function idealTrace(word,n){
  const keys=[...word].map(c=>({x:POS[c].x,y:POS[c].y}));
  const cum=[0];for(let i=1;i<keys.length;i++)cum.push(cum[i-1]+dist2(keys[i],keys[i-1]));
  const L=cum[cum.length-1]||1;
  return {pts:resampleN(keys,n),keyAt:cum.map(c=>Math.round(c/L*(n-1))),keys};
}
function scoreStroke(raw,word){

  /* Dynamic time warping aligns the drawn stroke to the ideal one, so a slow start or a fast finish isn't punished */
  const D=Array.from({length:N+1},()=>new Float64Array(N+1).fill(Infinity));D[0][0]=0;
  for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){const c=dist2(drawn[i-1],P[j-1]);D[i][j]=c+Math.min(D[i-1][j],D[i][j-1],D[i-1][j-1]);}
  let i=N,j=N,steps=0;const match=Array.from({length:N},()=>[]);
  while(i>0&&j>0){match[j-1].push(i-1);steps++;const a=D[i-1][j-1],b=D[i-1][j],c=D[i][j-1];if(a<=b&&a<=c){i--;j--;}else if(b<=c)i--;else j--;}

  const hits=ideal.keys.map((k,li)=>{let best=Infinity,bp=drawn[0];for(const di of match[ideal.keyAt[li]]){const d=dist2(drawn[di],k);if(d<best){best=d;bp=drawn[di];}}
    if(best===Infinity)best=dist2(bp,k);
    return {ch:word[li],d:Math.round(best),tier:best<=44?'ok':(best<=118?'near':'no'),score:best<=22?1:Math.max(0,1-(best-22)/160),x:Math.round(bp.x),y:Math.round(bp.y)};});

}

  const end=e=>{if(!stroke.on)return;stroke.on=false;const r=cur();
    if(stroke.pts.length<4||pathLen(stroke.pts)<80){stroke.pts=[];renderGlyph();renderStatus(t('drawReject'),true);return;}
    finishDraw(r,stroke.pts);stroke.pts=[];};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
}
function finishDraw(r,pts){
  if(isSentence(r))return finishSentenceWord(r,pts);
  const res=scoreStroke(pts,r.word);
  haptic(res.acc>=70?'success':'medium');sfx('lift');
  r.done=true;r.acc=res.acc;r.hits=res.hits;r.stroke=resampleN(pts,48).map(p=>({x:Math.round(p.x),y:Math.round(p.y)}));r.won=res.acc>=70;r.bonus=0;
  r.ink=inkForDraw(r);addInk(r.ink);setTimeout(()=>inkFloat(r.ink),500);
  if(S.mode==='daily'){recordDraw(r);if(S.rounds.every(x=>x.done)){r.bonus=S.pack?0:recordDay();if(!S.pack)REMIND.dayDone();renderInk(true);}}
  const dayDone=S.mode==='daily'&&S.rounds.every(x=>x.done);
  setTimeout(()=>{if(res.acc>=70){sfx(dayDone?'big':'win');confetti(dayDone?160:(res.acc>=95?110:60));}else sfx('lose');},700+r.word.length*120);
  saveDaily();
  renderRounds();renderStatus();renderGuesses();
  revealDraw(r);
}

function drawPanel(r){

  }

    <p>${t('drawHelp')}${r.hard?t('drawHelpHard'):''}</p></div>`;
  const on=r.hits.filter(h=>h.tier==='ok').length;
  const drift=r.hits.filter(h=>h.tier!=='ok').map(h=>{let best=null,bd=Infinity;for(const k in POS){const d=dist2(POS[k],h);if(d<bd){bd=d;best=k;}}return best&&best!==h.ch?`${h.ch.toUpperCase()}→${best.toUpperCase()}`:null;}).filter(Boolean);
  return `<div class="drawpanel"><div class="drawword">${word}</div><div class="acc"><b>${r.acc}%</b><span>${t('onKey',{on,n:r.word.length})}</span></div>${drift.length?`<p class="drift">${t('drifted',{list:drift.join(', ')})}</p>`:''}</div>`;

function startDrawPractice(len){S.mode='practice';S.pack=null;S.practiceLen=len;S.practiceType='draw';S.rounds=[makeDraw(randomWord(len||6))];S.round=0;S.cur='';render();}
function startSentence(packId){S.mode='sentence';S.pack=packId||null;const shown=pickSentence(packId);S.rounds=[makeSentence(shown.split(' ').map(norm),shown)];S.round=0;S.cur='';render();}
/* A sentence is drawn blind: each word is scored as it's lifted but nothing shows until the last one */
function finishSentenceWord(r,pts){
  const res=scoreStroke(pts,r.word);
  r.items.push({word:r.word,acc:res.acc,hits:res.hits,stroke:resampleN(pts,48).map(p=>({x:Math.round(p.x),y:Math.round(p.y)}))});
  haptic('light');sfx('lift');
  if(r.idx<r.words.length-1){
    r.idx++;r.word=r.words[r.idx];
    el('glyph').querySelectorAll('.live,.livestart').forEach(x=>x.classList.add('fade'));
    setTimeout(()=>{renderGlyph();renderStatus();renderGuesses();},320);
    return;
  }
  r.done=true;r.acc=Math.round(r.items.reduce((a,it)=>a+it.acc,0)/r.items.length);r.won=r.acc>=70;r.view=0;r.bonus=0;r.ink=0;
  haptic(r.won?'success':'medium');
  setTimeout(()=>{if(r.won){sfx('win');confetti(r.acc>=90?110:60);}else sfx('lose');},900);
  renderRounds();renderStatus();renderGuesses();
  revealDraw(r);
}
const viewItem=r=>{const it=r.items[r.view]||r.items[0];return {word:it.word,stroke:it.stroke,hits:it.hits};};

/* ---------- Input ---------- */
/* Revealed letters live in the row being typed: a ghost until the cursor reaches them, then they snap in and you type on past */
/* The word being typed is S.cur; a space marks a box you skipped. Revealed letters sit in their boxes from the start. */
function fillKnown(r){const n=r.word.length;let a=[...S.cur.padEnd(n,' ')].slice(0,n);r.rev.forEach(i=>{a[i]=r.word[i];});S.cur=a.join('').replace(/ +$/,'');}
const blank=i=>!S.cur[i]||S.cur[i]===' ';
function firstBlank(r,from){const n=r.word.length;for(let k=0;k<n;k++){const i=((from||0)+k)%n;if(blank(i)&&!r.rev.includes(i))return i;}return n;}
/* The box you're on: the one you tapped, or else the first empty box */
function selIdx(r){if(!r||isDraw(r))return 0;const n=r.word.length;
  if(r.sel!=null&&r.sel<n&&!r.rev.includes(r.sel))return r.sel;return firstBlank(r,0);}
function setAt(i,ch){const a=[...S.cur.padEnd(i+1,' ')];a[i]=ch;S.cur=a.join('').replace(/ +$/,'');}
function refreshTyping(){const r=cur();renderGuesses();paintKeys(r);renderGlyph();renderTrace();}
function onKey(k){
  const r=cur(); if(r.done||isDraw(r)) return;
  if(limbo(r)) return resolveLimbo(r);
  if(k==='enter') return submit();
  const n=r.word.length;fillKnown(r);
  if(k==='back'){
    let i=selIdx(r);
    if(i>=n||blank(i)){i=-1;for(let j=Math.min(selIdx(r),n)-1;j>=0;j--)if(!blank(j)&&!r.rev.includes(j)){i=j;break;}}
    if(i<0){for(let j=n-1;j>=0;j--)if(!blank(j)&&!r.rev.includes(j)){i=j;break;}}
    if(i>=0){setAt(i,' ');r.sel=i;}
    refreshTyping();haptic('light');sfx('back');return;}
  if(k.length===1&&L.alpha.includes(k)){const i=selIdx(r);if(i>=n)return;
    setAt(i,k);fillKnown(r);const nx=firstBlank(r,i+1);r.sel=nx<n?nx:null;
    refreshTyping();haptic('light');sfx('tap');}
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.view!=='game'||document.querySelector('.scrim')) return;
  if(e.key==='Enter') onKey('enter'); else if(e.key==='Backspace') onKey('back'); else if(e.key.length===1){const k=norm(e.key);if(k.length===1&&L.alpha.includes(k))onKey(k);}
});
function submit(){
  const r=cur(),n=r.word.length;
  fillKnown(r);if(S.cur.length<n||S.cur.includes(' ')){r.sel=null;renderStatus(t('needs',{n}),true);renderGuesses(false,true);paintKeys(r);renderGlyph();sfx('bad');return;}
  if(S.mode!=='custom'&&!validGuess(S.cur)){renderStatus(t('notInList'),true);renderGuesses(false,true);haptic('error');sfx('bad');return;}
  const ev=evaluate(S.cur,r.word);
  r.g.push(S.cur);r.ev.push(ev);S.cur='';r.sel=null;
  const won=ev.every(e=>e==='ok');
  if(won){finishRound(r,true);return;}
  if(r.g.length>=allowed(r)){
    const price=PRICE.extra[r.extra];
    if(price!==undefined&&getStats().ink>=price){saveDaily();renderGlyph(true);renderStatus();renderGuesses(true);renderKeyboard();setTimeout(()=>extraSheet(r,price),n*70+350);return;}
    finishRound(r,false);return;
  }
  saveDaily();renderGlyph(true);renderStatus();renderGuesses(true);renderKeyboard();renderRounds();sfx('reveal');
}
function finishRound(r,won){
  const n=r.word.length;clockStop(r);
  r.done=true;r.won=won;r.bonus=0;
  haptic(won?'success':'error');
  if(won){r.ink=inkFor(r);addInk(r.ink);setTimeout(()=>inkFloat(r.ink),n*70+300);}
  if(S.mode==='daily'){recordRound(r);if(S.rounds.every(x=>x.done)){r.bonus=S.pack?0:recordDay();if(!S.pack)REMIND.dayDone();renderInk(true);}}
  const dayDone=S.mode==='daily'&&S.rounds.every(x=>x.done);
  setTimeout(()=>{if(won){sfx(dayDone?'big':'win');confetti(dayDone?160:70);}else sfx('lose');},n*70+250);
  saveDaily();
  renderGlyph();renderStatus();renderGuesses(true);renderKeyboard();renderRounds();
  setTimeout(()=>{reveal(r);},n*70+450);
}
function extraSheet(r,price){

  <div class="btns"><button class="btn primary" id="xBuy">${inkIcon()}${t('extraBuy',{p:price})}</button><button class="btn" id="xGive">${t('giveUp')}</button></div>`);

function inkIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><path d="M12 2.5c3.5 4.8 6 8 6 11.5a6 6 0 0 1-12 0c0-3.5 2.5-6.7 6-11.5z"/></svg>`;}

/* ---------- Hints shop ---------- */
/* Positions already settled, by a reveal or by a guess that landed on the key */
function knownAt(r){const k=new Set(r.rev);r.g.forEach((g,gi)=>r.ev[gi].forEach((e,i)=>{if(e==='ok')k.add(i);}));return k;}
function openMiddle(r){const known=knownAt(r),out=[];for(let i=1;i<r.word.length-1;i++)if(!known.has(i))out.push(i);return out;}
function hintsSheet(){
  const r=cur();if(r.done)return;
  const st=getStats(),n=r.word.length,known=knownAt(r),middle=openMiddle(r);
  const items=[
    {k:'cat',t:t('hCat'),d:t('hCatD'),p:PRICE.cat,used:!!r.cat,ok:!!catOf(r.word),
      ic:ICONS.cat},
    {k:'first',t:t('hFirst'),d:t('hFirstD'),p:PRICE.first,used:known.has(0),found:known.has(0)&&!r.rev.includes(0),ok:true,
      ic:ICONS.first},
    {k:'last',t:t('hLast'),d:t('hLastD'),p:PRICE.last,used:known.has(n-1),found:known.has(n-1)&&!r.rev.includes(n-1),ok:true,
      ic:ICONS.last},
    {k:'letter',t:t('hMid'),d:t('hMidD'),p:PRICE.letter,used:middle.length===0,found:middle.length===0&&!r.rev.some(i=>i>0&&i<n-1),ok:middle.length>0,
      ic:ICONS.letter},
    {k:'place',t:t('hPlace'),d:r.hard?t('hPlaceLocked'):t('hPlaceD'),p:PRICE.place,used:r.placed,ok:!r.hard,
      ic:ICONS.place}
  ];
  const cards=items.map(it=>{const poor=!it.used&&st.ink<it.p;const dis=it.used||!it.ok||poor;
    return `<button class="hintcard${it.used?' used':''}${poor?' poor':''}" data-k="${it.k}" ${dis?'disabled':''}><span class="ic"><svg class="ico" viewBox="0 0 24 24">${it.ic}</svg></span><span class="t"><b>${it.t}</b><small>${it.d}</small></span><span class="price">${it.used?(it.found?t('found'):t('used')):(it.ok?inkIcon()+it.p:t('locked'))}</span></button>`;}).join('');
  openSheet(`<h2>${t('hints')}</h2>
  <div class="balance"><b>${inkIcon()}${st.ink}</b><span>${t('earnHow')}</span>${STORE.ready&&PRODUCTS.ink.length?`<button class="chip" id="hGetInk">${t('getInk')}</button>`:''}</div>
  <div class="hints">${cards}</div>`,true);
  document.querySelectorAll('.hintcard').forEach(b=>b.onclick=()=>buyHint(b.dataset.k));
  const gi=document.getElementById('hGetInk');if(gi)gi.onclick=()=>inkSheet();
}
function buyHint(k){
  const r=cur(),n=r.word.length;
  const known=knownAt(r);
  if(k==='cat'){if(r.cat||!catOf(r.word))return;if(!spend(PRICE.cat))return;r.cat=true;}
  else if(k==='first'){if(known.has(0))return;if(!spend(PRICE.first))return;r.rev.push(0);}
  else if(k==='last'){if(known.has(n-1))return;if(!spend(PRICE.last))return;r.rev.push(n-1);}
  else if(k==='letter'){const middle=openMiddle(r);if(!middle.length)return;if(!spend(PRICE.letter))return;r.rev.push(middle[Math.floor(Math.random()*middle.length)]);}
  else if(k==='place'){if(r.hard||r.placed)return;if(!spend(PRICE.place))return;r.placed=true;}
  r.rev.forEach(i=>{if(S.cur.length>i&&S.cur[i]!==r.word[i])S.cur=S.cur.slice(0,i)+r.word[i]+S.cur.slice(i+1);});fillKnown(r);
  closeSheet();saveDaily();renderGlyph();renderStatus();renderGuesses();renderKeyboard();
}

function reveal(r){

function resultSheet(r){

    const best=r.items.reduce((b,it)=>it.acc>b.acc?it:b,r.items[0]),worst=r.items.reduce((b,it)=>it.acc<b.acc?it:b,r.items[0]),sw=it=>esc(r.shownWords[r.items.indexOf(it)]||it.word);

  } else if(isDraw(r)){

  } else {

  ${S.mode==='daily'&&S.rounds.every(x=>x.done)?`<div class="btns"><button class="btn primary" id="stShare">${sq('share')}${t('shareToday')}</button></div>`:''}`,true);

  <div class="btns"><button class="btn primary" id="mPractice">${t('practice')}</button><button class="btn" id="mSend">${sq('send')}${t('send')}</button></div>

  ${REMIND.avail()?`<button class="switch" id="mRemind" role="switch" aria-checked="${REMIND.st.on}"><span class="sw"><span class="knob"></span></span><span class="swtext"><b>${t('reminder')}</b><small>${t('reminderD')}</small></span></button>

  const rm=document.getElementById('mRemind');if(rm){rm.onclick=async()=>{if(REMIND.st.on){await REMIND.disable();rm.setAttribute('aria-checked','false');toast(t('reminderOff'));}else{const ok=await REMIND.enable(REMIND.st.hour);rm.setAttribute('aria-checked',String(ok));toast(ok?t('reminderOn'):t('reminderDenied'));}};
    document.getElementById('mHour').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;REMIND.st.hour=+b.dataset.h;REMIND.save();document.querySelectorAll('#mHour button').forEach(x=>x.classList.toggle('on',x===b));if(REMIND.st.on)await REMIND.sync();});}
  document.getElementById('mLang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setLang(b.dataset.l,true);closeSheet();loadDaily();if(S.view==='home')goHome();else render();});
  document.getElementById('mPractice').onclick=()=>{closeSheet();practiceSheet();};

  const ss=document.getElementById('mSound');ss.onclick=()=>{SFX.on=!SFX.on;store('sq.sound',SFX.on);ss.setAttribute('aria-checked',SFX.on);if(SFX.on){audioCtx();sfx('win');}toast(SFX.on?t('soundOn'):t('soundOff'));};

function packsSheet(){
  const st=getStats();
  const cards=PACKS.map(pk=>{const owned=PK.owns(pk.id),season=pk.season&&inSeason(pk.season),prog=owned?packProgress(pk.id):null,price=STORE.ready?STORE.price(pk.iap):null;
    const sw=`<span class="swatch" style="--a:${pk.theme.light.ink};--b:${pk.theme.light.guess};--c:${pk.theme.light.bg2};--da:${pk.theme.dark.ink};--db:${pk.theme.dark.guess};--dc:${pk.theme.dark.surface}">${sq('pk_'+pk.id)}</span>`;
    const body=owned
      ?`<div class="btns small"><button class="btn primary" data-act="play" data-p="${pk.id}">${prog.done===4?t('packReview'):prog.done?t('packContinue',{d:prog.done}):t('packPlay')}</button><button class="btn" data-act="practice" data-p="${pk.id}">${t('practice')}</button><button class="btn" data-act="sentence" data-p="${pk.id}">${t('packTitles')}</button></div>
         <button class="switch" data-act="theme" data-p="${pk.id}" role="switch" aria-checked="${PK.st.theme===pk.id}"><span class="sw"><span class="knob"></span></span><span class="swtext"><b>${t('packLook')}</b><small>${t('packLookD')}</small></span></button>`
      :`<div class="btns small"><button class="btn primary" data-act="unlock" data-p="${pk.id}" ${st.ink<pk.ink?'disabled':''}>${inkIcon()}${t('unlockFor',{n:pk.ink})}</button>${price?`<button class="btn" data-act="buy" data-p="${pk.id}">${t('buyFor',{p:price})}</button>`:''}</div>`;
    return `<div class="pack"><div class="packhead">${sw}<div class="mt"><b>${pk.name}${season?`<em>${t('inSeason')}</em>`:''}</b><small>${pk.tag} · ${t('packCount',{w:pk.words.length,p:pk.phrases.length})}</small></div></div>${body}</div>`;}).join('');
  openSheet(`<h2>${t('packsTitle')}</h2><p>${t('packsBody')}</p><div class="packs">${cards}</div>${STORE.ready?`<div class="btns"><button class="btn" id="pkRestore">${t('restore')}</button></div>`:''}${LANG!=='en'?`<p>${t('packsEnglish')}</p>`:''}`,false);
  document.querySelectorAll('.pack [data-act]').forEach(b=>b.onclick=()=>packAction(b.dataset.act,b.dataset.p,b));
  const rs=document.getElementById('pkRestore');if(rs)rs.onclick=async()=>{const n=await STORE.restore();toast(n?t('restored',{n}):t('restoredNone'));if(n)packsSheet();};
}
async function packAction(act,id,btn){
  const pk=PK.get(id);if(!pk)return;
  if(act==='play'){closeSheet();loadPack(id);const nx=S.rounds.findIndex(r=>!r.done);S.round=nx>=0?nx:0;render();}
  else if(act==='practice'){closeSheet();startPackPractice(id);}
  else if(act==='sentence'){closeSheet();startSentence(id);}
  else if(act==='theme'){PK.st.theme=PK.st.theme===id?null:id;PK.save();applyPackTheme();document.querySelectorAll('.pack .switch').forEach(x=>x.setAttribute('aria-checked',x.dataset.p===PK.st.theme));sfx('tap');}
  else if(act==='unlock'){if(!spend(pk.ink))return;PK.st.owned.push(id);PK.save();sfx('win');confetti(90);packsSheet();}
  else if(act==='buy'){btn.disabled=true;const ok=await STORE.buy(pk.iap);if(ok){if(!PK.owns(id))PK.st.owned.push(id);PK.save();sfx('win');confetti(90);}packsSheet();}
}
function inkSheet(){
  const rows=PRODUCTS.ink.map(x=>{const price=STORE.price(x.id);if(!price)return '';return `<button class="hintcard" data-ink="${x.id}"><span class="ic">${inkIcon()}</span><span class="t"><b>${t('inkN',{n:x.ink})}</b><small>${t('inkPackD')}</small></span><span class="price">${price}</span></button>`;}).join('');
  openSheet(`<h2>${t('getInk')}</h2><p>${t('getInkBody')}</p><div class="inkpacks">${rows}</div>`,true);
  document.querySelectorAll('[data-ink]').forEach(b=>b.onclick=async()=>{b.disabled=true;const x=PRODUCTS.ink.find(y=>y.id===b.dataset.ink);const ok=await STORE.buy(x.id);if(ok){addInk(x.ink);sfx('win');toast(t('inkAdded',{n:x.ink}));closeSheet();}else b.disabled=false;});
}

function sendSheet(){
  openSheet(`<h2>${t('sendTitle')}</h2><p>${t('sendBody')}</p>
  <div class="field"><input id="sendWord" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${t('sendPh')}"></div>
  <svg class="glyph" id="sendPreview" viewBox="-20 -20 1040 340" aria-hidden="true" style="background:var(--bg);border-radius:12px"></svg>
  <div class="btns"><button class="btn primary" id="sendCopy">${ic('copy')}${t('copyLink')}</button></div>
  <textarea class="share visually-hidden" id="sendBox" rows="2" readonly></textarea>`,true);
  const inp=document.getElementById('sendWord'),pv=document.getElementById('sendPreview'),cp=document.getElementById('sendCopy');
  const draw=()=>{const w=[...norm(inp.value)].filter(c=>L.alpha.includes(c)).join('');inp.value=w;pv.innerHTML=lattice()+(w.length>=2?targetGlyph(w,'send:'+w,false,false,false):'');cp.disabled=w.length<3;};
  inp.addEventListener('input',draw);draw();inp.focus();
  cp.onclick=()=>{const w=inp.value;if(w.length<3)return;const link=SHARE_URL+'#'+encodeWord(w);document.getElementById('sendBox').value=link;
    document.getElementById('sendBox').classList.remove('visually-hidden');const msg=t('canYouRead',{link});shareOut(msg).then(ok=>{if(!ok)copy(msg,'sendBox');});};
}
el('btnHow').onclick=howSheet; el('btnStats').onclick=statsSheet; el('btnMore').onclick=moreSheet;

/* ---------- Boot ---------- */
function openLink(h){
  h=h||'';
  let m=/^#c-(?:(en|es|pt)-)?([a-z0]{3,10})$/.exec(h);
  if(m){setLang(m[1]||'en',false);const w=decodeWord(m[2]);if(![...w].every(c=>L.alpha.includes(c)))return false;closeSheet();startCustom(w,m[2]);return true;}
  m=/^#d-(?:(en|es|pt)-)?([a-z0]{3,10})-(\d{1,3})-([A-Za-z0-9_-]{8,})$/.exec(h);
  if(m){setLang(m[1]||'en',false);const stroke=decStroke(m[4]);const w=decodeWord(m[2]);if(stroke&&[...w].every(c=>L.alpha.includes(c))){closeSheet();startDuel(w,Math.min(100,+m[3]),stroke);return true;}}
  return false;
}
function finishTutorialIfAny(){
  if(S.mode!=='tutorial')return;
  const after=S.after;S.after=null;
  if(after&&openLink(after))return;
  loadDaily();goHome();
}
function start(){
  bindDraw();REMIND.sync();
  const h=location.hash||'';
  if(NATIVE&&NP.App&&NP.App.getLaunchUrl){NP.App.getLaunchUrl().then(r=>{if(r&&r.url)openAppUrl(r.url);}).catch(()=>{});}
  if(!store('sq.seen')){store('sq.seen',1);S.after=openLinkable(h)?h:null;startTutorial();return;}
  if(!openLink(h)){loadDaily();goHome();}
}
function openLinkable(h){return /^#(c|d)-/.test(h||'');}
window.addEventListener('hashchange',()=>{openLink(location.hash||'');});
/* Universal Links (iOS app): a friend's link opens the app instead of the web page; the URL arrives here, not in location.hash */
function openAppUrl(url){try{const h=new URL(url).hash;if(!openLinkable(h))return;if(S.mode==='tutorial'){S.after=h;return;}openLink(h);}catch(e){}}
if(NATIVE&&NP.App){NP.App.addListener('appUrlOpen',e=>{if(e&&e.url)openAppUrl(e.url);});}
/* Android's back gesture: close an open sheet, then leave a game for the home screen, then leave the app */
if(ANDROID&&NP.App){NP.App.addListener('backButton',()=>{
  if(document.querySelector('#overlay .scrim')){closeSheet();return;}
  if(S.view==='game'){goHome();return;}
  try{NP.App.minimizeApp?NP.App.minimizeApp():NP.App.exitApp();}catch(e){}});}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(()=>({cur:S.cur}));}
const boot=()=>{start();try{const d=window.claude&&window.claude.hot&&window.claude.hot.data;if(d&&d.cur){S.cur=d.cur;renderGuesses();}}catch(e){}};
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
