<!--STANDALONE--><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squiggle">
<meta name="theme-color" content="#EDF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="description" content="Three squiggles a day. Each one is the line a finger draws swipe-typing a word. Read it, then draw one of your own.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!--/STANDALONE--><title>Squiggle</title>
<!--ARTIFACT--><meta name="claude:viewport-fit-sides" content="cover"><!--/ARTIFACT-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column. A paper card holds the keyboard-shaped tracing frame; guess tiles sit beneath it;
   the typing keyboard at the bottom shares the frame's exact geometry so the eye can travel straight down from a corner
   of the squiggle to the key under it. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --fg:#151D33; --muted:#66718C; --line:#D6DCE8;
  --cell:#EEF2F8; --cellline:#DFE5F0; --keycap:#FFFFFF; --keyboard:#DCE2ED; --keytext:#1B2440; --keyshadow:#B9C2D4;
  --ink:#2A3FC9; --inksoft:rgba(42,63,201,.14); --guess:#C81E7E;
  --ok:#15915F; --near:#DC8E00; --absent:#A3ACBF; --onstatus:#FFFFFF;
  --accent:#2A3FC9; --onaccent:#FFFFFF; --scrim:rgba(21,29,51,.45);
  --shadow:0 1px 0 rgba(21,29,51,.06), 0 10px 28px -14px rgba(21,29,51,.22);
  --display:'Fredoka','Avenir Next Rounded','Nunito',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Helvetica Neue',Arial,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#171E33; --fg:#EAEEF8; --muted:#97A3C0; --line:#28324C;
    --cell:#1E2740; --cellline:#283352; --keycap:#263052; --keyboard:#111829; --keytext:#EAEEF8; --keyshadow:#0B1020;
    --ink:#8FB0FF; --inksoft:rgba(143,176,255,.16); --guess:#FF75BD;
    --ok:#2FBF86; --near:#E6AE3D; --absent:#3F4A66; --onstatus:#0E1424;
    --accent:#8FB0FF; --onaccent:#0E1424; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#171E33; --fg:#EAEEF8; --muted:#97A3C0; --line:#28324C;
  --cell:#1E2740; --cellline:#283352; --keycap:#263052; --keyboard:#111829; --keytext:#EAEEF8; --keyshadow:#0B1020;
  --ink:#8FB0FF; --inksoft:rgba(143,176,255,.16); --guess:#FF75BD;
  --ok:#2FBF86; --near:#E6AE3D; --absent:#3F4A66; --onstatus:#0E1424;
  --accent:#8FB0FF; --onaccent:#0E1424; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px;gap:10px}

/* Header */
.top{display:flex;align-items:center;gap:10px}
.brandbtn{text-align:left;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.game{display:flex;flex-direction:column;gap:10px;flex:1}
/* Home: the day at a glance */
.home{display:flex;flex-direction:column;gap:14px;flex:1;padding-block:6px 10px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:15px;max-width:40ch}
.ladder{display:flex;flex-direction:column;gap:8px}
.lcard{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:10px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px 8px 8px;text-align:left;width:100%;border:2px solid transparent}
.lcard.cur{border-color:var(--ink)}
.lcard:disabled{opacity:.55;cursor:default}
.lcard .mini{display:block;width:100%;height:auto;aspect-ratio:1040/340;max-width:100%}
.lcard .mini .cellrect{fill:var(--cell);stroke:var(--cellline);stroke-width:2}
.lcard .mini .dot{fill:var(--cellline)}
.lcard .mini .ink{fill:none;stroke:var(--ink);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.lcard .mini .inkhalo{display:none}
.lcard .mini .start{fill:var(--ink)} .lcard .mini .end{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round} .lcard .mini .loop{fill:none;stroke:var(--ink);stroke-width:12}
.lcard .mini .clean{fill:none;stroke:var(--ink);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.lcard .mini .lab circle{fill:var(--surface);stroke:var(--ink);stroke-width:6} .lcard .mini .lab text{fill:var(--fg);font-family:var(--display);font-weight:700;font-size:56px;text-anchor:middle;dominant-baseline:central}
.lcard .mini .lab{animation:none}
.lcard .mini .stroke{fill:none;stroke:var(--guess);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.85} .lcard .mini .livestart{fill:var(--guess)} .lcard .mini .mark{display:none}
.lcard .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.lcard .side b{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.lcard .side small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lcard .side .tagx{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.lcard .side .tagx.won{background:var(--ok);color:var(--onstatus)} .lcard .side .tagx.lost{background:var(--absent);color:var(--onstatus)} .lcard .side .tagx.now{background:var(--ink);color:var(--onaccent)}
.drawmini{display:grid;place-items:center;height:100%;color:var(--ink)}
.drawmini svg{width:34px;height:34px}
.cta{display:flex;flex-direction:column;gap:8px}
.cta .btn.big{height:56px;font-size:19px;flex:1 1 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile2{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:left;min-height:96px}
.tile2 .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.tile2 .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile2 b{font-family:var(--display);font-weight:600;font-size:16px}
.tile2 small{color:var(--muted);font-size:12px;line-height:1.35}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip svg{width:14px;height:14px;fill:var(--ink)}
.chip.muted{font-weight:400;color:var(--muted)}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:34px;height:20px;overflow:visible}
.sub{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.top .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Round pills */
.rounds{display:flex;gap:8px;align-items:center}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:999px;
  background:var(--surface);color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;box-shadow:var(--shadow);
  border:2px solid transparent}
.pill.cur{border-color:var(--ink);color:var(--fg)}
.pill.won{background:var(--ok);color:var(--onstatus)}
.pill.lost{background:var(--absent);color:var(--onstatus)}
.pill small{font-family:var(--body);font-weight:400;font-size:12px;opacity:.9}
.rounds .modetag{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surface);
  font-family:var(--display);font-weight:600;color:var(--fg);box-shadow:var(--shadow);font-size:15px}

/* Glyph card */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
.glyph{display:block;width:100%;height:auto;aspect-ratio:1040/340;max-width:100%}
.glyph .cellrect{fill:var(--cell);stroke:var(--cellline);stroke-width:2}
.glyph .ghost{fill:var(--muted);font-family:var(--display);font-weight:600;font-size:40px;text-anchor:middle;dominant-baseline:central;opacity:.55}
.glyph .ink{fill:none;stroke:var(--ink);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.glyph .inkhalo{fill:none;stroke:var(--inksoft);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.glyph .start{fill:var(--ink)}
.glyph .end{fill:none;stroke:var(--ink);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.glyph .loop{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round}
.glyph .gpath{fill:none;stroke:var(--guess);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 12;opacity:.9}
.glyph .mark{stroke:var(--surface);stroke-width:4}
.glyph .mark.ok{fill:var(--ok)} .glyph .mark.near{fill:var(--near)} .glyph .mark.no{fill:var(--absent)}
.glyph .clean{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.glyph .lab circle{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.glyph .lab text{fill:var(--fg);font-family:var(--display);font-weight:700;font-size:44px;text-anchor:middle;dominant-baseline:central}
.glyph .lab.hit circle{fill:var(--ok);stroke:var(--ok)} .glyph .lab.hit text{fill:var(--onstatus)}
.glyph.draw{touch-action:none;cursor:crosshair}
.glyph .rival{fill:none;stroke:var(--near);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 14;opacity:.9}
.coach{background:var(--surface);border-left:4px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--fg);box-shadow:var(--shadow);max-width:56ch;margin:0 auto 4px}
.coach b{color:var(--ink)}
.cardpreview{width:100%;max-width:260px;height:auto;border-radius:14px;box-shadow:var(--shadow);align-self:center;display:block}
/* Draw round reads top-down: prompt, canvas, result */
.app.drawmode .rounds{order:1} .app.drawmode .guesses{order:2;min-height:0} .app.drawmode .card{order:3} .app.drawmode .status{order:4} .app.drawmode .kb{order:5}
.glyph .live,.glyph .stroke{fill:none;stroke:var(--guess);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.glyph .livestart{fill:var(--guess)}
@keyframes fadein{to{opacity:1}}
.pill svg{width:18px;height:18px}
.drawpanel{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:6px}
.drawpanel p{margin:0;color:var(--muted);font-size:14px;max-width:38ch}
.drawpanel .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.drawword{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.drawword .dl{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;background:var(--surface);box-shadow:var(--shadow);color:var(--fg)}
.drawword .dl.ok{background:var(--ok);color:var(--onstatus)} .drawword .dl.near{background:var(--near);color:var(--onstatus)} .drawword .dl.no{background:var(--absent);color:var(--onstatus)}
.acc{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.acc b{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--ink)}
.acc span{color:var(--muted);font-size:14px}
.minilist.two{grid-template-columns:1fr 1fr} .minilist.two button{font-size:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.glyph .firstmark{fill:none;stroke:var(--near);stroke-width:6;stroke-dasharray:10 8}
.glyph .firstlab{fill:var(--near);font-family:var(--display);font-weight:700;font-size:40px;text-anchor:middle;dominant-baseline:central}
.glyph .dot{fill:var(--cellline)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.glyph .lab{transform-box:fill-box;transform-origin:center;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
.glyph .clean.anim{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 1.1s ease-out forwards}
@media (prefers-reduced-motion: reduce){.glyph .lab,.glyph .clean.anim{animation:none;stroke-dashoffset:0}}

/* Status + hints */
.status{display:flex;align-items:center;gap:8px;min-height:36px}
.status .msg{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.status .msg b{color:var(--fg);font-weight:700}
.status .msg.err{color:var(--guess);font-weight:700}
.hint{height:32px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.hint svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint.used{background:var(--near);color:var(--onstatus)}
.hint:disabled{opacity:.45;cursor:default}

/* Guess rows */
.guesses{display:flex;flex-direction:column;gap:6px;min-height:calc(5 * 40px + 4 * 6px)}
.row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;max-width:calc(var(--n) * 46px + (var(--n) - 1) * 6px);margin:0 auto;width:100%}
.tile{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;
  background:var(--surface);box-shadow:var(--shadow);text-transform:uppercase;color:var(--fg)}
.tile.ok{background:var(--ok);color:var(--onstatus)} .tile.near{background:var(--near);color:var(--onstatus)} .tile.no{background:var(--absent);color:var(--onstatus)}
.tile.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.tile.typed{box-shadow:inset 0 0 0 2px var(--ink)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.row.fresh .tile{animation:flip .5s ease both;animation-delay:calc(var(--i) * 70ms)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.row.shake{animation:shake .4s ease}
@media (prefers-reduced-motion: reduce){.row.fresh .tile,.row.shake{animation:none}}

/* Keyboard */
.kb{margin-top:auto;background:var(--keyboard);border-radius:var(--radius);padding:8px 6px 10px;display:flex;flex-direction:column;gap:7px;position:relative}
.kbtrace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.kbtrace .tr{fill:none;stroke:var(--guess);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.kbtrace .trloop{fill:none;stroke:var(--guess);stroke-width:4;opacity:.9}
.kbtrace .trstart{fill:var(--guess)}
.key.near::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:3px solid var(--near)}
.kbrow{display:flex;gap:5px;justify-content:center}
.kbrow.r1{padding:0 calc(5% + 2px)} .kbrow.r2{padding:0 calc(15% + 2px)}
.key{flex:1 1 0;height:48px;border-radius:9px;background:var(--keycap);color:var(--keytext);font-family:var(--display);font-weight:600;font-size:18px;
  box-shadow:0 2px 0 var(--keyshadow);display:grid;place-items:center;text-transform:uppercase;min-width:0;user-select:none;position:relative}
.key:active{transform:translateY(1px);box-shadow:0 1px 0 var(--keyshadow)}
.key.ok{background:var(--ok);color:var(--onstatus)}
.key.wide{flex:1.6 1 0;font-size:13px;font-family:var(--body);font-weight:700}
.key.wide svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.key.first::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:3px solid var(--near)}
.kbrow.r2 .key.wide:first-child,.kbrow.r2 .key.wide:last-child{flex:1.6 1 0}
.kbrow.r2{padding:0 2px}

/* Sheet + modals */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.scrim.center{align-items:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px 18px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:14px}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet{animation:rise .3s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.sheet h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.sheet p{margin:0;color:var(--muted);max-width:60ch}
.sheet p b{color:var(--fg)}
.sheet .x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.sheet .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.sheet{position:relative}
.answer{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);line-height:1}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;height:48px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.primary{background:var(--accent);color:var(--onaccent);box-shadow:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.share{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.5;background:var(--bg);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;border:0;width:100%;color:var(--fg);resize:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dist{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.dist .d{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:13px}
.dist .bar{height:20px;border-radius:6px;background:var(--absent);color:var(--onstatus);font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding:0 7px;min-width:24px;font-size:12px}
.dist .bar.top{background:var(--ok)}
.how{display:flex;flex-direction:column;gap:12px}
.how .step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}

<script>
(function(){
'use strict';
/* Native iPhone app (Capacitor wrapper in ios-app/). The same page runs on the web and inside the app;
   these two flags are the only difference it ever checks. */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
const SHARE_URL=window.SQUIGGLE_SHARE_URL||(location.origin+location.pathname);
function haptic(kind){
  if(!NATIVE||!NP.Haptics)return;
  try{
    if(kind==='success'||kind==='error')NP.Haptics.notification({type:kind==='success'?'SUCCESS':'ERROR'});
    else NP.Haptics.impact({style:kind==='heavy'?'HEAVY':kind==='medium'?'MEDIUM':'LIGHT'});
  }catch(e){}
}
/* Native share sheet when there is one (the app, or a browser with Web Share); false means fall back to copy. */
async function shareOut(text){
  if(NATIVE&&NP.Share){try{await NP.Share.share({text});return true;}catch(e){return false;}}
  if(navigator.share){try{await navigator.share({text});return true;}catch(e){return false;}}
  return false;
}
/* ---------- Keyboard geometry ---------- */
const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
const OFF=[0,0.5,1.5];
const U=100;
const POS={};
ROWS.forEach((r,ri)=>[...r].forEach((ch,ci)=>{POS[ch]={x:(ci+OFF[ri]+0.5)*U,y:(ri+0.5)*U,row:ri,col:ci};}));

/* ---------- Words ---------- */
const WEEK=[
  ['word','finger','keyboard'],
  ['jump','spiral','squiggle'],
  ['flow','puzzle','shortcut'],
  ['maze','sketch','treasure'],
  ['knot','doodle','mountain'],
  ['path','zigzag','football'],
  ['quiz','rhythm','notebook']
];
const POOL={
  4:'home fire moon lamp rope bird frog kite wave rock sand leaf tree bell drum pond snow gold milk wolf bear deer fish ship rain wind star lake road hill barn farm cake soup corn rice pear plum lime salt mint jazz folk ball bike boat coin ring glow dusk dawn echo zone hero king lion duck goat crab hawk swan iron wool silk clay'.split(' '),
  6:'bridge castle garden forest meadow island planet rocket candle mirror window pillow jacket button zipper pocket ladder hammer anchor pencil marker crayon canvas violin guitar breeze frozen summer winter autumn spring sunset tunnel harbor desert jungle canyon saddle rabbit badger beaver turtle lizard monkey parrot pigeon salmon shrimp walnut peanut cherry banana orange tomato potato carrot pepper butter cheese cookie muffin waffle coffee pickle thread needle basket bucket shovel helmet magnet marble puddle'.split(' '),
  8:'backpack umbrella sandwich elephant kangaroo scorpion hedgehog squirrel reindeer flamingo pancakes popsicle lollipop cupcakes lemonade broccoli zucchini mushroom cucumber eggplant hazelnut cinnamon backyard driveway sidewalk campfire sailboat airplane elevator snowball rainbows sunshine starfish seashell seahorse dolphins whistles whiskers scissors password lanterns necklace bracelet calendar envelope magazine birdcage hammocks blizzard'.split(' ')
};
const VALID=new Set("__VALID__".split('|'));
WEEK.flat().forEach(w=>VALID.add(w)); Object.values(POOL).flat().forEach(w=>VALID.add(w));

/* ---------- Utils ---------- */
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const EPOCH=new Date(2026,9,15);
function todayIndex(){const n=new Date();const d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.round((d0-EPOCH)/864e5));}
function fmtDate(d){return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dailyWords(day){
  if(day<WEEK.length) return WEEK[day];
  const r=rng(hash('day'+day)*7+day);
  return [4,6,8].map(L=>POOL[L][Math.floor(r()*POOL[L].length)]);
}
function randomWord(len){const Ls=len?[len]:[4,6,8];const L=Ls[Math.floor(Math.random()*Ls.length)];const p=POOL[L];return p[Math.floor(Math.random()*p.length)];}
const DRAW_WEEK=['planet','guitar','rocket','castle','bridge','garden','pillow'];
function dailyDrawWord(day){
  if(day<DRAW_WEEK.length) return DRAW_WEEK[day];
  const r=rng(hash('draw'+day)*3+day);const p=POOL[6];return p[Math.floor(r()*p.length)];
}

/* Link code for send-a-squiggle: a light scramble so the word isn't readable in the URL */
function encodeWord(w){return 'c-'+[...w].map((c,i)=>String.fromCharCode(97+((c.charCodeAt(0)-97+7*i+11)%26))).join('');}
function decodeWord(code){return [...code].map((c,i)=>String.fromCharCode(97+(((c.charCodeAt(0)-97-7*i-11)%26)+26)%26)).join('');}

/* ---------- Glyph geometry ---------- */
function points(word,seed,jit){
  const r=rng(hash(seed));
  const pts=[],loops=[];
  for(let i=0;i<word.length;i++){
    const ch=word[i],p=POS[ch]; if(!p) continue;
    const jx=(r()*2-1)*jit*U, jy=(r()*2-1)*jit*U;
    if(i>0&&word[i-1]===ch){loops.push(pts.length-1);continue;}
    pts.push({x:p.x+jx,y:p.y+jy,ch,i});
  }
  return {pts,loops};
}
function curve(pts){
  if(pts.length===0) return '';
  const f=n=>Math.round(n*10)/10;
  if(pts.length===1) return `M${f(pts[0].x)} ${f(pts[0].y)}`;
  if(pts.length===2) return `M${f(pts[0].x)} ${f(pts[0].y)}L${f(pts[1].x)} ${f(pts[1].y)}`;
  const P=[pts[0],...pts,pts[pts.length-1]];
  let d=`M${f(pts[0].x)} ${f(pts[0].y)}`;
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C${f(c1x)} ${f(c1y)} ${f(c2x)} ${f(c2y)} ${f(p2.x)} ${f(p2.y)}`;
  }
  return d;
}
function endChevron(pts){
  if(pts.length<2) return '';
  const a=pts[pts.length-2],b=pts[pts.length-1];
  const ang=Math.atan2(b.y-a.y,b.x-a.x),L=30,w=Math.PI*0.78;
  const p1={x:b.x-L*Math.cos(ang-w),y:b.y-L*Math.sin(ang-w)},p2={x:b.x-L*Math.cos(ang+w),y:b.y-L*Math.sin(ang+w)};
  const f=n=>Math.round(n*10)/10;
  return `M${f(p1.x)} ${f(p1.y)}L${f(b.x)} ${f(b.y)}L${f(p2.x)} ${f(p2.y)}`;
}
function cells(showLetters){
  let s='';
  for(const ch in POS){const p=POS[ch];
    s+=`<rect class="cellrect" x="${p.x-44}" y="${p.y-44}" width="88" height="88" rx="16"/>`;
    if(showLetters) s+=`<text class="ghost" x="${p.x}" y="${p.y+2}">${ch.toUpperCase()}</text>`;
  }
  return s;
}
/* Bounding box of the drawn curve (sampled), so a floating squiggle can be centered without revealing its true keys */
function bbox(pts,loops){
  const xs=[],ys=[];
  if(pts.length<=2){pts.forEach(p=>{xs.push(p.x);ys.push(p.y);});}
  else{
    const P=[pts[0],...pts,pts[pts.length-1]];xs.push(pts[0].x);ys.push(pts[0].y);
    for(let i=1;i<P.length-2;i++){const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
      const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
      for(let k=1;k<=10;k++){const t=k/10,m=1-t;xs.push(m*m*m*p1.x+3*m*m*t*c1x+3*m*t*t*c2x+t*t*t*p2.x);ys.push(m*m*m*p1.y+3*m*m*t*c1y+3*m*t*t*c2y+t*t*t*p2.y);}}
  }
  loops.forEach(i=>{const p=pts[i];xs.push(p.x-8,p.x+36);ys.push(p.y-34,p.y+10);});
  return {x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};
}
function centerTransform(pts,loops){const b=bbox(pts,loops);return `translate(${(500-(b.x0+b.x1)/2).toFixed(1)} ${(150-(b.y0+b.y1)/2).toFixed(1)})`;}
function lattice(){let s='';for(let y=50;y<=250;y+=50)for(let x=50;x<=950;x+=50)s+=`<circle class="dot" cx="${x}" cy="${y}" r="3"/>`;return s;}
function traceMarkup(pts,loops,showEnds){
  const d=curve(pts);
  let s=`<path class="inkhalo" d="${d}"/><path class="ink" d="${d}"/>`;
  loops.forEach(i=>{const p=pts[i];s+=`<circle class="loop" cx="${(p.x+14).toFixed(1)}" cy="${(p.y-12).toFixed(1)}" r="22"/>`;});
  if(showEnds){s+=`<circle class="start" cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="17"/>`;s+=`<path class="end" d="${endChevron(pts)}"/>`;}
  return s;
}
function targetGlyph(word,seed,placed,hard,rev){
  const {pts,loops}=points(word,seed,0.27);
  let inner=traceMarkup(pts,loops,!hard);
  if(rev&&rev.length){
    const at={};pts.forEach(p=>{at[p.i]=p;});
    for(let i=1;i<word.length;i++) if(!at[i]) at[i]=at[i-1];
    rev.forEach(i=>{const p=at[i];if(!p)return;inner+=`<circle class="firstmark" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="34"/><text class="firstlab" x="${p.x.toFixed(1)}" y="${(p.y-50).toFixed(1)}">${word[i].toUpperCase()}</text>`;});
  }
  return placed?inner:`<g transform="${centerTransform(pts,loops)}">${inner}</g>`;
}
function guessOverlay(guess,ev,placed){
  const {pts,loops}=points(guess,'x',0);
  let s=`<path class="gpath" d="${curve(pts)}"/>`;
  pts.forEach(p=>{s+=`<circle class="mark ${ev[p.i]}" cx="${p.x}" cy="${p.y}" r="15"/>`;});
  return placed?s:`<g transform="${centerTransform(pts,loops)}">${s}</g>`;
}
function cleanGlyph(word,anim){
  const {pts,loops}=points(word,'x',0);
  let s=`<path class="clean${anim?' anim':''}" d="${curve(pts)}"/>`;
  loops.forEach(i=>{const p=pts[i];s+=`<circle class="loop" cx="${p.x+14}" cy="${p.y-12}" r="22" style="opacity:.7"/>`;});
  [...word].forEach((ch,i)=>{const p=POS[ch];s+=`<g class="lab" style="animation-delay:${anim?(.25+i*.12):0}s"><circle cx="${p.x}" cy="${p.y}" r="31"/><text x="${p.x}" y="${p.y+2}">${ch.toUpperCase()}</text></g>`;});
  return s;
}

/* ---------- Scoring ---------- */
/* Feedback is keyboard distance, not letter presence: for each corner of your guess, how far it landed from the real key.
   'ok' = on the key, 'near' = a touching key (one step on the staggered grid), 'no' = cold. */
const TOUCH=118;
function kdist(a,b){const p=POS[a],q=POS[b];return Math.hypot(p.x-q.x,p.y-q.y);}
function evaluate(guess,target){
  const n=target.length,res=new Array(n);
  for(let i=0;i<n;i++){const d=kdist(guess[i],target[i]);res[i]=d===0?'ok':(d<=TOUCH?'near':'no');}
  return res;
}

/* ---------- State ---------- */
const BASE_GUESSES=4, HARD_GUESSES=3;
const PRICE={first:10,last:10,letter:15,place:25,extra:[20,35]};
const START_INK=30, DAY_BONUS=20;
const S={mode:'daily',day:todayIndex(),round:0,rounds:[],cur:'',practiceLen:null,customCode:null,hard:!!store('sq.hard'),rival:null,after:null,view:'game'};
const MODE_LABEL={practice:'Practice',custom:'From a friend',duel:'Duel',tutorial:'Learn'};
const el=id=>document.getElementById(id);

function makeRound(word){return {type:'read',word,g:[],ev:[],rev:[],placed:false,hard:S.hard,extra:0,done:false,won:false,ink:0};}
function makeDraw(word){return {type:'draw',word,g:[],ev:[],rev:[],placed:false,hard:S.hard,extra:0,done:false,won:false,ink:0,acc:0,hits:[],stroke:[]};}
const isDraw=r=>r&&r.type==='draw';
function baseGuesses(r){return r.hard?HARD_GUESSES:BASE_GUESSES;}
function allowed(r){return baseGuesses(r)+r.extra;}
function setHard(on){S.hard=on;store('sq.hard',on);S.rounds.forEach(r=>{if(!r.done&&r.g.length===0)r.hard=on;});saveDaily();if(S.view==='home')renderHome();else render();}
function cur(){return S.rounds[S.round];}
const reads=()=>S.rounds.filter(r=>!isDraw(r));
const drawRound=()=>S.rounds.find(isDraw);

function loadDaily(){
  const saved=store('sq.daily.v5');
  S.mode='daily'; S.day=todayIndex(); S.cur=''; S.rival=null;
  if(saved&&saved.day===S.day&&Array.isArray(saved.rounds)&&saved.rounds.length===4){S.rounds=saved.rounds;S.round=Math.min(saved.round,3);}
  else{S.rounds=[...dailyWords(S.day).map(makeRound),makeDraw(dailyDrawWord(S.day))];S.round=0;}
}

/* ---------- Draw mode: you get the word, you draw its squiggle from memory ---------- */
function penIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16z"/><path d="M14 6l3 3"/></svg>`;}
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist2(p[i],p[i-1]);return L;}
/* Uniform arc-length resample to exactly n points */
function resampleN(p,n){
  if(p.length===0) return [];
  if(p.length===1) return Array.from({length:n},()=>({x:p[0].x,y:p[0].y}));
  const L=pathLen(p);if(L===0) return Array.from({length:n},()=>({x:p[0].x,y:p[0].y}));
  const step=L/(n-1),out=[{x:p[0].x,y:p[0].y}];let acc=0,i=1,a=p[0];
  while(out.length<n-1&&i<p.length){
    const b=p[i],d=dist2(a,b);
    if(acc+d>=step){const t=(step-acc)/d;const q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};out.push(q);a=q;acc=0;}
    else{acc+=d;a=b;i++;}
  }
  while(out.length<n) out.push({x:p[p.length-1].x,y:p[p.length-1].y});
  return out;
}
/* The ideal trace is the polyline through key centers; keyAt[i] is the sample index where letter i sits */
function idealTrace(word,n){
  const keys=[...word].map(c=>({x:POS[c].x,y:POS[c].y}));
  const cum=[0];for(let i=1;i<keys.length;i++)cum.push(cum[i-1]+dist2(keys[i],keys[i-1]));
  const L=cum[cum.length-1]||1;
  return {pts:resampleN(keys,n),keyAt:cum.map(c=>Math.round(c/L*(n-1))),keys};
}
function scoreStroke(raw,word){
  const N=64,drawn=resampleN(raw,N),ideal=idealTrace(word,N),P=ideal.pts;
  /* Dynamic time warping aligns the drawn stroke to the ideal one, so a slow start or a fast finish isn't punished */
  const D=Array.from({length:N+1},()=>new Float64Array(N+1).fill(Infinity));D[0][0]=0;
  for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){const c=dist2(drawn[i-1],P[j-1]);D[i][j]=c+Math.min(D[i-1][j],D[i][j-1],D[i-1][j-1]);}
  let i=N,j=N,steps=0;const match=Array.from({length:N},()=>[]);
  while(i>0&&j>0){match[j-1].push(i-1);steps++;const a=D[i-1][j-1],b=D[i-1][j],c=D[i][j-1];if(a<=b&&a<=c){i--;j--;}else if(b<=c)i--;else j--;}
  const dev=D[N][N]/Math.max(1,steps);
  const hits=ideal.keys.map((k,li)=>{let best=Infinity,bp=drawn[0];for(const di of match[ideal.keyAt[li]]){const d=dist2(drawn[di],k);if(d<best){best=d;bp=drawn[di];}}
    if(best===Infinity)best=dist2(bp,k);
    return {ch:word[li],d:Math.round(best),tier:best<=44?'ok':(best<=118?'near':'no'),score:best<=22?1:Math.max(0,1-(best-22)/160),x:Math.round(bp.x),y:Math.round(bp.y)};});
  const letterScore=hits.reduce((a,h)=>a+h.score,0)/hits.length;
  const shapeScore=Math.max(0,1-Math.max(0,dev-18)/130);
  const acc=Math.round(100*(0.6*letterScore+0.4*shapeScore));
  return {acc,hits,dev:Math.round(dev)};

    x.save();x.translate(60+22+gw/2,y+cardH/2);x.scale(k,k);x.translate(-(b.x0+b.x1)/2,-(b.y0+b.y1)/2);
    x.lineCap='round';x.lineJoin='round';const p=new Path2D(curve(pts));
    x.lineWidth=34;x.strokeStyle=C.halo;x.stroke(p);x.lineWidth=15;x.strokeStyle=C.ink;x.stroke(p);
    loops.forEach(li=>{const q=pts[li];x.beginPath();x.arc(q.x+14,q.y-12,22,0,Math.PI*2);x.lineWidth=11;x.stroke();});
    if(!r.hard){x.fillStyle=C.ink;x.beginPath();x.arc(pts[0].x,pts[0].y,17,0,Math.PI*2);x.fill();x.lineWidth=13;x.stroke(new Path2D(endChevron(pts)));}
    x.restore();
    const cx=60+cw*0.72;
    x.fillStyle=C.muted;x.font=`700 26px ${B}`;x.fillText(`${r.word.length} LETTERS`,cx,y+60);
    x.fillStyle=r.won?C.fg:C.miss;x.font=`700 74px ${F}`;x.fillText(r.won?`${r.g.length}/${baseGuesses(r)}`:'✕',cx,y+cardH/2+30);
    let sx=cx;const sy=y+cardH-66;
    for(let g=0;g<r.g.length;g++){x.fillStyle=(g===r.g.length-1&&r.won)?C.ok:C.cell;roundRect(x,sx,sy,30,30,7);x.fill();sx+=38;}
    if(!r.won){x.fillStyle=C.miss;roundRect(x,sx,sy,30,30,7);x.fill();sx+=38;}
    const hn=r.rev.length+(r.placed?1:0);if(hn){x.fillStyle=C.near;x.font=`700 24px ${B}`;x.fillText('hint'+(hn>1?'s':''),sx+6,sy+24);}
  });
  if(dr&&dr.done){const fy=H-270;x.fillStyle=C.card;roundRect(x,60,fy,W-120,110,36);x.fill();
    x.fillStyle=C.fg;x.font=`700 40px ${F}`;x.fillText(`Drew ${dr.word.toUpperCase()} at ${dr.acc}%`,100,fy+68);
    let sx=W-60-40-dr.word.length*38;dr.hits.forEach((h,k)=>{x.fillStyle=h.tier==='ok'?C.ok:h.tier==='near'?C.near:C.cell;roundRect(x,sx+k*38,fy+40,30,30,7);x.fill();});}
  x.fillStyle=C.fg;x.font=`700 46px ${F}`;x.fillText('Can you read them?',60,H-74);
  x.fillStyle=C.muted;x.font=`400 30px ${B}`;x.textAlign='right';x.fillText(SHARE_URL.replace(/^https?:\/\//,'').replace(/\/$/,''),W-60,H-74);x.textAlign='left';
  return c;
}
function blobToBase64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});}
async function sharePng(canvas,text){
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));if(!blob)return false;
  if(NATIVE&&NP.Share&&NP.Filesystem){
    try{const data=await blobToBase64(blob);const f=await NP.Filesystem.writeFile({path:'squiggle-share.png',data,directory:'CACHE'});await NP.Share.share({text,files:[f.uri]});return true;}catch(e){return false;}
  }
  if(navigator.canShare&&typeof File==='function'){const file=new File([blob],'squiggle.png',{type:'image/png'});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text});return true;}catch(e){return false;}}}
  return false;
}
function copy(text,boxId){
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>selectBox(boxId));}
  else selectBox(boxId);
}
function selectBox(id){const b=document.getElementById(id);if(b){b.focus();b.select();toast('Select and copy the text');}}

function ic(n){const d={share:'<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3m0 0L8 7m4-4 4 4"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/>'}[n];return `<svg viewBox="0 0 24 24">${d}</svg>`;}
function openSheet(html,center){
  closeSheet();

  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('.x'))closeSheet();});
  el('overlay').appendChild(o);

function closeSheet(){el('overlay').innerHTML='';}
function toast(t){const h=el('toastHost');h.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(h._t);h._t=setTimeout(()=>h.innerHTML='',1800);}

function howSheet(){
  openSheet(`<h2>How to play</h2>
  <div class="how">
    <div class="step"><div class="num">1</div><div>Each squiggle is the line a finger draws when it <b>swipe-types a word</b> on a phone keyboard. The dot is where the finger lands; the chevron is where it lifts.</div></div>
    <div class="step"><div class="num">2</div><div>You see the shape at <b>true size</b> but not where it sat. A sweep that's five keys wide on the keyboard below is five keys wide here. Slide it around the keyboard in your head until the corners land on letters that make a word.</div></div>
    <div class="step"><div class="num">3</div><div>Type a word of the right length. As you type, your trace draws across the keys in pink, so you can compare its shape to the squiggle before you commit.</div></div>
    <div class="step"><div class="num">4</div><div>Feedback is <b>distance, not letters</b>. Each corner of your guess reports how far it landed from the real key. Nothing tells you whether a letter is "in the word somewhere". Only the shape does.</div></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>On the key</span><span><i style="background:var(--near)"></i>Next door (a touching key)</span><span><i style="background:var(--absent)"></i>Cold</span></div>
    <div class="step"><div class="num">5</div><div><b>Round four flips it.</b> You get the word and draw its squiggle from memory, one stroke on the blank keys. You're scored on how close your line runs to the real trace.</div></div>
    <p>Three squiggles to read (4, 6 and 8 letters, <b>four guesses</b> each) and one to draw. Solving earns <b>ink</b>: more for longer words and fewer guesses, 1.5× on hard, plus a bonus for finishing the day.</p>
    <p>Ink buys hints (first letter, last letter, a middle letter, or <b>Place it</b>, which drops the squiggle onto the real keys) and one more guess when you run out. Hints show on your share.</p>
    <p><b>Hard mode</b> (in the ⋯ menu): three guesses, no start or end marker, and Place it is locked.</p>
  </div>
  <div class="btns"><button class="btn primary" id="howGo">Start tracing</button></div>`,true);
  document.getElementById('howGo').onclick=closeSheet;
}
function statsSheet(){
  const st=getStats();const pct=st.rounds?Math.round(100*st.solved/st.rounds):0;
  const max=Math.max(1,...Object.values(st.dist));
  const r=cur();const curN=(S.mode==='daily'&&r.done&&r.won)?r.g.length:null;
  const dist=['1','2','3','4','5','x'].map(k=>`<div class="d"><span>${k==='x'?'✕':(k==='5'?'5+':k)}</span><div class="bar${(curN!==null&&String(curN)===k)?' top':''}" style="width:${Math.max(8,100*st.dist[k]/max)}%">${st.dist[k]}</div></div>`).join('');
  openSheet(`<h2>Your traces</h2>
  <div class="balance"><b>${inkIcon()}${st.ink}</b><span>${st.inkEarned} ink earned all time</span></div>
  <div class="stats"><div class="stat"><b>${st.days}</b><span>Days</span></div><div class="stat"><b>${pct}</b><span>Solve %</span></div><div class="stat"><b>${st.streak}</b><span>Streak</span></div><div class="stat"><b>${st.maxStreak}</b><span>Best</span></div></div>
  <h3>Guesses per squiggle</h3><div class="dist">${dist}</div>
  <h3>Drawn squiggles</h3>
  <div class="stats three"><div class="stat"><b>${st.traces||0}</b><span>Traces</span></div><div class="stat"><b>${st.traces?Math.round(st.traceSum/st.traces):0}</b><span>Avg %</span></div><div class="stat"><b>${st.traceBest||0}</b><span>Best %</span></div></div>
  <p>${st.perfect} perfect ${st.perfect===1?'day':'days'} (all three read). Streak counts days you finished the ladder, draw included.</p>
  ${S.mode==='daily'&&S.rounds.every(x=>x.done)?`<div class="btns"><button class="btn primary" id="stShare">${ic('share')}Share today</button></div>`:''}`,true);
  const b=document.getElementById('stShare');if(b)b.onclick=()=>{closeSheet();shareSheet();};
}

/* ---------- Boot ---------- */
function openLink(h){
  let m=/^#c-([a-z]{3,10})$/.exec(h||'');
  if(m){closeSheet();startCustom(decodeWord(m[1]),m[1]);return true;}
  m=/^#d-([a-z]{3,10})-(\d{1,3})-([A-Za-z0-9_-]{8,})$/.exec(h||'');
  if(m){const stroke=decStroke(m[3]);if(stroke){closeSheet();startDuel(decodeWord(m[1]),Math.min(100,+m[2]),stroke);return true;}}
  return false;
}
function finishTutorialIfAny(){
  if(S.mode!=='tutorial')return;
  const after=S.after;S.after=null;
  if(after&&openLink(after))return;
  loadDaily();goHome();
}
function start(){
  bindDraw();
  const h=location.hash||'';
  if(!store('sq.seen')){store('sq.seen',1);S.after=openLinkable(h)?h:null;startTutorial();return;}
  if(!openLink(h)){loadDaily();goHome();}
}
function openLinkable(h){return /^#(c|d)-/.test(h||'');}
window.addEventListener('hashchange',()=>{openLink(location.hash||'');});
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(()=>({cur:S.cur}));}
const boot=()=>{start();try{const d=window.claude&&window.claude.hot&&window.claude.hot.data;if(d&&d.cur){S.cur=d.cur;renderGuesses();}}catch(e){}};
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
